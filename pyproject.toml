[project]
name = "tennify-wordart"
version = "0.1.0"
description = "Inject wordart PNG ligatures (GSUB liga + COLR/CPAL) into an OTF"
requires-python = ">=3.10"
dependencies = [
    "fonttools>=4.50",
    "vtracer>=0.6.15",
    "pillow>=10.0",
    "numpy>=1.26",
    "uharfbuzz>=0.39",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tennify/segments.py" = ["N802"]